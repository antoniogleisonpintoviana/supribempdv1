    <style>
        /* Textura do Plástico do Terminal PDV */
        .texture-plastic {
            background-color: #272a2e;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.5) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.08), inset 0 -3px 8px rgba(0,0,0,0.8);
        }

        /* Moldura Chanfrada Realista do LCD */
        .lcd-bezel {
            background: linear-gradient(145deg, #18191b, #2c2f34);
            box-shadow: 
                inset 0 4px 10px rgba(0, 0, 0, 0.9),
                0 2px 4px rgba(255, 255, 255, 0.05);
        }

        /* Efeito de Vidro do Mostrador LCD Green retroiluminado */
        .lcd-screen {
            background: linear-gradient(180deg, #718a56 0%, #597042 70%, #4c6237 100%);
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.6),
                inset 0 2px 4px rgba(0, 0, 0, 0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        /* Moldura de Teclas 3D / Nicho da Tecla */
        .key-socket {
            background: linear-gradient(145deg, #181a1c, #30343a);
            border-radius: 6px;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Efeito Tecla 3D Física */
        .pos-key {
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.05s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            word-break: break-word;
            line-height: 1.1;
            padding: 2px 4px;
            box-shadow: 
                0 4px 0 rgba(0, 0, 0, 0.4),
                0 5px 6px rgba(0,0,0,0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.6),
                inset 0 -2px 2px rgba(0, 0, 0, 0.2);
        }

        .pos-key:active, .pos-key.pressed {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 rgba(0, 0, 0, 0.4),
                0 2px 3px rgba(0,0,0,0.2),
                inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        /* Capas Transparentes do Teclado PDV (Efeito Moldado Acrílico) */
        .acrylic-cap {
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.08) 100%);
        }

        /* Cores de Teclas Específicas */
        .key-white {
            background-color: #dedfda;
            color: #111;
            border: 1px solid #c4c5c0;
        }

        .key-red {
            background-color: #f17879;
            color: #111;
            border: 1px solid #d95e5f;
        }

        .key-lightred {
            background-color: #fca5a5;
            color: #111;
            border: 1px solid #f87171;
        }

        .key-green {
            background-color: #a4dda8;
            color: #111;
            border: 1px solid #85cb87;
        }

        .key-yellow {
            background-color: #fde047;
            color: #111;
            border: 1px solid #eab308;
        }

        .key-blue {
            background-color: #bae6fd;
            color: #111;
            border: 1px solid #7dd3fc;
        }

        /* Estilo Gertec numérico especifico */
        .gertec-key-black {
            background: linear-gradient(180deg, #373a40 0%, #26282c 100%);
            color: #ffffff;
            border: 1px solid #1a1b1e;
            box-shadow: 
                0 4px 0 #151618,
                0 5px 6px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        .gertec-key-black:active, .gertec-key-black.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #151618, inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .gertec-key-yellow {
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            color: #000;
            font-weight: 900;
            border: 1px solid #ca8a04;
        }

        .gertec-key-red {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            color: #000;
            font-weight: 800;
            border: 1px solid #b91c1c;
        }

        .gertec-key-lightyellow {
            background: linear-gradient(180deg, #fef08a 0%, #fde047 100%);
            color: #000;
            font-weight: 800;
            border: 1px solid #eab308;
        }

        .gertec-key-green {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: #000;
            font-weight: 800;
            border: 1px solid #15803d;
        }

        /* Scrollbar custom para a lista do PDV no visor */
        .lcd-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .lcd-scroll::-webkit-scrollbar-thumb {
            background: rgba(15, 31, 6, 0.4);
            border-radius: 2px;
        }
    </style>
</head>

                </div>

            </div>

            <!-- Rodapé informativo -->
            <div class="mt-4 text-[11px] text-neutral-400 font-mono text-center">
                Teclado Numérico Gertec PDV
            </div>

        </div>

    </div>

    <!-- LÓGICA E INTERATIVIDADE EM JAVASCRIPT -->
    <script>
        // Estado do Sistema de Caixa Simulado
        let inputBuffer = "";
        let currentTotal = 0.00;
        let isOperatorLoggedIn = false;
        let currentStatus = "CAIXA LIVRE";

        const lcdMain = document.getElementById('lcd-main-display');
        const lcdSub = document.getElementById('lcd-sub-display');
        const lcdTotal = document.getElementById('lcd-total');
        const statusBadge = document.getElementById('pos-status-badge');

        // Síntese de Áudio para Feedback de Beep (Tone.js sintético via Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 1200, duration = 0.05) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                // Silencioso se áudio não for suportado
            }
        }

        // Função para formatação de moeda BRL
        function formatMoney(value) {
            return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Manipulação das teclas do painel principal PDV
        function pressKey(keyName) {
            playBeep(900, 0.04);
            
            if (!keyName) return;

            switch (keyName) {
                case 'Entrada Operador':
                    isOperatorLoggedIn = true;
                    statusBadge.innerText = "ABERTO";
                    statusBadge.className = "bg-green-950 text-emerald-300 px-1.5 py-0.5 rounded text-[10px]";
                    lcdMain.innerText = "CAIXA ABERTO";
                    lcdSub.innerText = "Informe o produto ou valor...";
                    inputBuffer = "";
                    break;

                case 'Saída Operador':
                    isOperatorLoggedIn = false;
                    statusBadge.innerText = "LIVRE";
                    statusBadge.className = "bg-pos-lcdText text-pos-lcdBg px-1.5 py-0.5 rounded text-[10px]";
                    lcdMain.innerText = "CAIXA FECHADO";
                    lcdSub.innerText = "Pressione ENTRADA DE OPERADOR";
                    currentTotal = 0.00;
                    inputBuffer = "";
                    updateDisplay();
                    break;

                case 'Cancela Item':
                case 'Cancela Cupom':
                    playBeep(400, 0.15);
                    inputBuffer = "";
                    lcdMain.innerText = keyName.toUpperCase() + " OK";
                    lcdSub.innerText = "Operação cancelada.";
                    break;

                case 'Dinheiro':
                case 'Tef Débito':
                case 'Tef Crédito':
                case 'Pix QR':
                    if (currentTotal > 0) {
                        playBeep(1500, 0.1);
                        lcdMain.innerText = "PAGO VIA " + keyName.toUpperCase();
                        lcdSub.innerText = "Troco: R$ 0,00";
                        currentTotal = 0.00;
                        inputBuffer = "";
                        updateDisplay();
                    } else {
                        lcdMain.innerText = "SEM VALOR A PAGAR";
                    }
                    break;

                case 'Abre Gaveta':
                case 'Sangria':
                    lcdMain.innerText = keyName.toUpperCase();
                    lcdSub.innerText = "Solicitação autorizada.";
                    break;

                default:
                    lcdMain.innerText = keyName.toUpperCase();
                    break;
            }
        }

        // Manipulação de teclas do Pinpad Gertec
        function pressNum(val) {
            playBeep(1300, 0.03);

            if (val === 'ANULA') {
                inputBuffer = "";
                lcdMain.innerText = "ENTRADA ANULADA";
                lcdSub.innerText = "Digite novamente...";
                return;
            }

            if (val === 'LIMPA') {
                inputBuffer = inputBuffer.slice(0, -1);
                lcdMain.innerText = inputBuffer || "0";
                return;
            }

            if (val === 'ENTRA') {
                if (inputBuffer.length > 0) {
                    const parsed = parseFloat(inputBuffer.replace(',', '.')) || 0;
                    currentTotal += parsed;
                    lcdMain.innerText = "ITEM ADD: R$ " + formatMoney(parsed);
                    lcdSub.innerText = "Total acumulado atualizado.";
                    inputBuffer = "";
                    updateDisplay();
                } else {
                    lcdMain.innerText = "DIGITE UM VALOR";
                }
                return;
            }

            if (val === 'CONSULTA') {
                lcdMain.innerText = "CONSULTA PRODUTO";
                lcdSub.innerText = "Passe o código no leitor";
                return;
            }

            if (val === 'SUBTOTAL') {
                lcdMain.innerText = "SUBTOTAL REGISTRADO";
                lcdSub.innerText = "Aguardando pagamento...";
                return;
            }

            if (val === 'MENU_FINAL') {
                lcdMain.innerText = "FINALIZAR VENDA";
                lcdSub.innerText = "Escolha a forma de pagamento";
                return;
            }

            // Entrada numérico normal
            if (inputBuffer.length < 10) {
                inputBuffer += val;
                lcdMain.innerText = "ENTRADA: " + inputBuffer;
                lcdSub.innerText = "Pressione ENTRA para confirmar";
            }
        }

        function updateDisplay() {
            lcdTotal.innerText = formatMoney(currentTotal);
        }

        // Suporte a teclado físico do computador
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressNum(e.key);
            } else if (e.key === 'Enter') {
                pressNum('ENTRA');
            } else if (e.key === 'Backspace') {
                pressNum('LIMPA');
            } else if (e.key === 'Escape') {
                pressNum('ANULA');
            } else if (e.key === ',') {
                pressNum(',');
            }
        });
    </script>
</body>
</html>
